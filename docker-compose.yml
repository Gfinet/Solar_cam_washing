services:

    nginx:
        build:
            context: gears/nginx/.
            dockerfile: Dockerfile
        container_name: nginx_t
        image: nginx_t:0.0.1 
        networks:
            - Solar_Cam
        ports:
            - 8080:80
            - 3000:443
        restart: on-failure
        depends_on:
            - backend
            - frontend

    backend:
        build: 
            context : gears/backend/.
            dockerfile: Dockerfile
        container_name: backend
        volumes:
            - ./gears/backend:/data
            - /data/node_modules
        environment:
            - APP_MODE=${APP_MODE}
        image:  backend
        networks:
            - Solar_Cam
        expose:
            - "3000"
        restart: on-failure

    frontend:
        build: 
            context : gears/frontend/.
            dockerfile: Dockerfile
        container_name: frontend
        volumes:
            - ./gears/frontend/src:/data 
            - /data/node_modules
        environment:
            - APP_MODE=${APP_MODE}
        image:  frontend
        networks:
            - Solar_Cam
        expose:
            - "5173"
        restart: on-failure

    db:
        build:
            context : gears/db/.
            dockerfile : Dockerfile
        container_name : db 
        volumes:
            - ./gears/db/data:/var/lib/postgresql/data
        expose:
            - "5432"
        restart: always
    

networks:
    Solar_Cam:
        driver: bridge