version: "3.7"

services:

    nginx:
        build:
            context: gears/nginx/.
            dockerfile: Dockerfile
        container_name: nginx_t
        image: nginx_t:0.0.1 
        networks:
            - transcendance
        ports:
            - 8080:80
            - 3000:3000
        restart: on-failure
        depends_on:
            - webapp

    webapp:
        build: 
            context : gears/webapp/.
            dockerfile: Dockerfile
        container_name: webapp
        volumes:
            - ./gears/webapp:/data
            - /data/node_modules
        environment:
            - APP_MODE=${APP_MODE}
        image:  webapp
        networks:
            - transcendance
        expose:
            - "3000"
        restart: on-failure

