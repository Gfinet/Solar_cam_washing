services:


    cloudflare:
        image: cloudflare/cloudflared:latest
        container_name: cloudflare
        restart: unless-stopped
        env_file:
            - .env
        command: tunnel run --token ${CLOUD_TOK}
        networks:
            - Home_net

    homeassistant:
        image: ghcr.io/home-assistant/home-assistant:stable
        container_name: homeassistant
        restart: unless-stopped
        privileged: true
        ports:
            - "8123:8123"
        volumes:
            - ./gears/homeassitant/config:/config
        environment:
            - TZ=Europe/Paris
        networks:
            - Home_net

    nginx:
        build:
            context: gears/nginx/.
            dockerfile: Dockerfile
        container_name: nginx
        image: nginx_t:0.0.1 
        restart: on-failure
        # network_mode: "service:tailscale"
        ports:
            - "8080:80"
            - "4443:443"
        networks:
            - Home_net
            - Solar_Cam
        depends_on:
            - backend
            - frontend

    backend:
        build: 
            context : gears/backend/.
            dockerfile: Dockerfile
        container_name: backend
        volumes:
            - ./gears/backend:/data
            - /data/node_modules
        env_file:
            - .env
        environment:
            - DATABASE_URL=postgresql://user_admin:mon_password_secret@db:5432/db
        image:  backend
        networks:
            - Solar_Cam
        # ports:
        #     - "3000:3000"
        #     - "5555:5555"
        depends_on:
            - db
            - frontend
        restart: on-failure
        expose:
            - "3000"

    frontend:
        build: 
            context : gears/frontend/.
            dockerfile: Dockerfile
        container_name: frontend
        volumes:
            - ./gears/frontend/src:/data 
            - /data/node_modules
        env_file:
            - .env
        image:  frontend
        networks:
            - Solar_Cam
        # ports:
        #     - "5173:5173" 
        restart: on-failure
        expose:
            - "5173"

    db:
        build:
            context : gears/db/.
            dockerfile : Dockerfile
        container_name : db 
        volumes:
            - ./gears/db/data:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=user_admin
            - POSTGRES_PASSWORD=mon_password_secret
            - POSTGRES_DB=db
        networks:
            - Solar_Cam
        expose:
            - "5432"
        # ports:
        #     - "5432:5432"
        restart: always

    # tailscale:
    #     image: tailscale/tailscale:latest
    #     container_name: tailscale
    #     hostname: Solar-Cams
    #     env_file: gears/tailscale/.env
    #     volumes:
    #         - ./gears/tailscale/tailscale_data:/var/lib/tailscale
    #         - /dev/net/tun:/dev/net/tun
    #     cap_add:
    #         - NET_ADMIN
    #         - SYS_MODULE
    #     networks:
    #         - Solar_Cam
    #     restart: unless-stopped
        
    
    go2rtc:
        image: alexxit/go2rtc
        container_name: go2rtc
        # network_mode: "service:tailscale"
        networks:
            - Solar_Cam
        env_file:
            - gears/go2rtc/.env
        volumes:
            - ./gears/go2rtc/go2rtc.yaml:/config/go2rtc.yaml
        expose:
            - "1984"
        # ports:
            # - "1984:1984"
            # - "8555:8555/udp"
        restart: always
    

networks:
    Home_net:
        driver: bridge
    Solar_Cam:
        driver: bridge