version: "3.7"

services:
    nginx:
        build:
            context: gears/nginx/.
            dockerfile: Dockerfile
        container_name: nginx_t
        image: nginx_t:0.0.1 
        networks:
            - transcendance
        ports:
            - 4243:4243
            - 8080:8080
        restart: on-failure

    webapp:
        build: 
            context : gears/webapp/.
            dockerfile: Dockerfile
        container_name: webapp
        image:  webapp
        networks:
            - transcendance
        expose:
            - "9000" 
        # volumes:
        #     - webapp:/var/www/webapp
        restart: on-failure

# volumes:
#     webapp:
#         driver: local
#         driver_opts:
#             type: 'none'
#             o: 'bind'
#             device: '/home/gfinet/Desktop/transcendance/gears/webapp/'

networks:
    transcendance:
        driver: bridge