version: "3.7"

services:

    nginx:
        build:
            context: gears/nginx/.
            dockerfile: Dockerfile
        container_name: nginx_t
        image: nginx_t:0.0.1 
        networks:
            - transcendance
        ports:
            - 8080:80
            - 3000:443
        restart: on-failure
        depends_on:
            - backend
            - frontend

    backend:
        build: 
            context : gears/backend/.
            dockerfile: Dockerfile
        container_name: backend
        volumes:
            - ./gears/backend:/data
            - /data/node_modules
        environment:
            - APP_MODE=${APP_MODE}
        image:  backend
        networks:
            - transcendance
        expose:
            - "3000"
        restart: on-failure

    frontend:
        build: 
            context : gears/frontend/.
            dockerfile: Dockerfile
        container_name: frontend
        volumes:
            - ./gears/frontend/src:/data 
            - /data/node_modules
        environment:
            - APP_MODE=${APP_MODE}
        image:  frontend
        networks:
            - transcendance
        expose:
            - "5173"
        restart: on-failure

    # db:
    #     build: 
    #         context : gears/db/.
    #         dockerfile: Dockerfile
    #     container_name: db
    #     volumes:
    #         - ./db/src:/data
    #     image:  db
    #     networks:
    #         - transcendance
    #     expose:
    #         - "9000"
    #     restart: on-failure

networks:
    transcendance:
        driver: bridge