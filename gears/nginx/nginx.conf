events{}
http
{
	include /etc/nginx/mime.types;
	tcp_nopush on;

    server
    {
        listen 80;
        return 301 https://localhost$request_uri;
    }

	server
	{
		listen 443 ssl;

		#root and index
		server_name		gfinet.42.fr localhost;
		# root			/var/www/wordpress;
		index			index.php index.html index.htm;

		#SSL/TLS conf
		ssl_certificate 	/etc/nginx/ssl/nginx.crt;
		ssl_certificate_key	/etc/nginx/ssl/nginx.key;
		ssl_protocols		TLSv1.2 TLSv1.3;
	
		http2_max_field_size	16k;
		http2_max_header_size	32k;
 

		proxy_intercept_errors on;

        location /
		{
			proxy_pass http://webapp:9000;

			# proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;

		}
		error_page 404 /404.html;
		location = /404.html
		{
			root /usr/share/nginx/html;
		}

		location /cgi/ {
		# On bypass tout dossier local, on demande directement à la webapp
		proxy_pass http://webapp:9000/cgi;
		
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Supprimez toute directive "root" ou "try_files" ici
		}
	}
}